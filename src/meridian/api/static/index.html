<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meridian · deep research agent</title>
<style>
  /* warm paper ramp (editorial world), moss accent for the primary action and source links only */
  :root { --bg:#f7f4ee; --card:#fdfbf7; --raised:#efe9df; --line:rgba(31,27,22,.08); --ink:#1f1b16; --ink2:#5e554a; --muted:#7b7266;
          --accent:#2f6f5e; --warn:#a4661f; --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; --ease: cubic-bezier(.22,1,.36,1); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .wrap { display:grid; grid-template-columns: 360px 1fr; min-height:100vh; }
  aside { border-right:1px solid var(--line); padding:24px; overflow-y:auto; max-height:100vh; position:sticky; top:0; }
  h1 { font:500 24px/1.2 Georgia, "Newsreader", serif; margin:0 0 4px; }
  .sub { color:var(--muted); font:12px var(--mono); margin-bottom:20px; }
  textarea { width:100%; height:96px; border:1px solid var(--line); border-radius:8px; padding:12px; font:inherit; background:var(--card); color:var(--ink); resize:vertical; }
  textarea:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { margin-top:8px; width:100%; height:40px; background:var(--ink); color:var(--card); border:0; border-radius:8px; font-weight:500; cursor:pointer;
           transition:background-color .15s var(--ease), transform .12s var(--ease); }
  button:hover { background:#36302a; } button:active { transform:scale(.98); }
  button:disabled { opacity:.5; }
  .section-label { font-size:13px; font-weight:500; color:var(--ink2); margin:24px 0 8px; }
  .ev { font-size:13px; border-left:1px solid var(--line); padding:4px 0 12px 12px; }
  .ev b { color:var(--ink); font-weight:500; } .ev.w b { color:var(--warn); }
  .ev small { color:var(--muted); display:block; margin-top:2px; }
  .chip { display:inline-block; font:11px var(--mono); border:1px solid var(--line); border-radius:4px; padding:0 6px; margin:4px 4px 0 0; background:var(--card); color:var(--ink2); }
  main { padding:48px 64px; max-width:880px; }
  article { font:17px/1.7 Georgia, "Newsreader", serif; }
  article h1 { font-size:32px; font-weight:500; } article h2 { margin-top:1.8em; border-bottom:1px solid var(--line); padding-bottom:4px; font-size:21px; font-weight:500; }
  article sup a { color:var(--accent); text-decoration:none; font:11px var(--mono); }
  article a { color:var(--accent); }
  article .src { font:13px/1.5 ui-sans-serif, system-ui, sans-serif; color:var(--ink2); }
  .empty { color:var(--muted); margin-top:30vh; text-align:center; font:19px Georgia, serif; }
  .dl a { font-size:13px; color:var(--accent); margin-right:16px; }
  .examples span { display:block; font-size:13px; color:var(--ink2); cursor:pointer; margin-top:8px; padding-left:12px; border-left:1px solid var(--line); }
  .examples span:hover { color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>Meridian</h1>
    <div class="sub" id="health">autonomous deep-research agent</div>
    <textarea id="q" placeholder="What do you want researched?"></textarea>
    <button id="go">Research</button>
    <div class="examples" id="ex"></div>
    <div class="section-label">Agent activity</div>
    <div id="log"></div>
  </aside>
  <main><div class="dl" id="dl"></div><article id="report"><div class="empty">Ask a question. The cited report appears here.</div></article></main>
</div>
<script>
const $ = id => document.getElementById(id);
const examples = ["What is the state of the grid-scale sodium-ion battery market in 2025, and who are the leading companies?",
  "How do sodium-ion batteries compare with LFP lithium batteries for grid storage on cost, energy density, cycle life and safety?"];
examples.forEach(e => { const s = document.createElement('span'); s.textContent = e; s.onclick = () => { $('q').value = e; }; $('ex').appendChild(s); });
fetch('/api/health').then(r => r.json()).then(h => $('health').textContent = `model ${h.model} · search ${h.search}`);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function log(title, detail, warn) { const d = document.createElement('div'); d.className = 'ev' + (warn ? ' w' : ''); d.innerHTML = `<b>${title}</b><small>${detail || ''}</small>`; $('log').appendChild(d); }
function inline(t) { return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
  .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>').replace(/\[(\d+)\]/g,'<sup><a href="#src-$1">[$1]</a></sup>'); }
function md(text) {
  let html = '', ul = false;
  for (const line of text.split('\n')) {
    const li = line.match(/^\s*[-*] (.*)/);
    if (li) { if (!ul) { html += '<ul>'; ul = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (ul) { html += '</ul>'; ul = false; }
    const h = line.match(/^(#{1,3}) (.*)/);
    if (h) html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if (/^\d+\. /.test(line)) html += `<p class="src" id="src-${line.split('.')[0]}">${inline(line)}</p>`;
    else if (line.startsWith('<sub>')) html += `<p class="src">${esc(line.replace(/<\/?sub>/g,''))}</p>`;
    else if (line.trim() === '---') html += '<hr>';
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (ul ? '</ul>' : '');
}
const handlers = {
  plan: d => log('plan', d.sub_questions.map(q => `${q.id}: ${esc(q.question)}`).join('<br>')),
  round: d => log(`research round ${d.round}`, `${d.sub_questions.length} sub-questions in parallel`),
  sources: d => log(`${d.sub_question} · reading`, d.sources.map(s => `<span class="chip">${esc(s.domain)} · ${s.credibility.toFixed(2)}</span>`).join('')),
  evidence: d => log(`${d.sub_question} · extracted`, `${d.claims} claims`),
  review: d => log('editor review', `covered: ${d.covered.join(', ') || '-'}${d.gaps.length ? '<br>gaps: ' + d.gaps.map(esc).join('; ') : ''}${d.conflicts.length ? '<br>' + d.conflicts.length + ' conflict(s) between sources' : ''}`, d.gaps.length || d.conflicts.length),
  outline: d => log('outline', d.sections.map(esc).join(' · ')),
  drafted: d => log('writers', `${d.sections} sections drafted in parallel`),
  verified: d => log('citation audit', d.removed.length ? `removed ${d.removed.length} unsupported sentence(s)` : 'every cited sentence is supported', d.removed.length),
  budget: d => log('budget stop', esc(d.reason), true),
  warning: d => log('warning', esc(d.message), true),
  blocked: d => log('blocked', esc(d.reason), true),
  done: d => log('done', `${d.stats.llm_calls} LLM calls · ${d.stats.tokens} tokens · $${d.stats.cost_usd} · ${d.stats.seconds}s`),
  report: d => { $('report').innerHTML = md(d.markdown); $('dl').innerHTML = `<a href="/api/reports/${d.id}.md">Download .md</a><a href="/api/reports/${d.id}.html" target="_blank">Open HTML</a><a href="/api/traces/${d.stats.trace_id}" target="_blank">Trace</a>`; },
  error: d => { log('error', esc(d.error), true); $('report').innerHTML = `<div class="empty">${esc(d.error)}</div>`; },
};
$('go').onclick = async () => {
  const question = $('q').value.trim(); if (question.length < 8) return;
  $('go').disabled = true; $('log').innerHTML = ''; $('dl').innerHTML = '';
  $('report').innerHTML = '<div class="empty">Researching…</div>';
  const r = await fetch('/api/research', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question}) });
  if (!r.ok) { handlers.error({error: (await r.text())}); $('go').disabled = false; return; }
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
  while (true) {
    const {value, done} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream:true}); let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const raw = buf.slice(0, i); buf = buf.slice(i + 2);
      const kind = (raw.match(/^event: (.*)$/m) || [])[1], data = JSON.parse((raw.match(/^data: (.*)$/m) || [])[1] || '{}');
      (handlers[kind] || (() => {}))(data);
    }
  }
  $('go').disabled = false;
};
</script>
</body>
</html>
